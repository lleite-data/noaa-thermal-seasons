# CI on every pull request and push to main: nothing reaches production untested.
#   python:    lint (ingest, dashboard) + unit tests for the ingest (offline: no NOAA, no Snowflake)
#   (dashboard smoke test + deploy: .github/workflows/dashboard.yml)
#   workflows: static check of the GitHub Actions files
#   dbt:       the project parses (YAML, Jinja, refs, tests) with a dummy profile
# Model SQL itself is tested by dbt build in dbt Cloud (dev + the production job).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements*.txt
      - run: pip install -r ingest/requirements.txt -r ingest/requirements-dev.txt
      - run: ruff check ingest dashboard
      - run: pytest -q ingest/tests

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install actionlint-py
      - run: actionlint

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-snowflake>=1.9,<2"
      - name: Dummy profile (parse never connects)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'YAML'
          noaa_thermal_seasons:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci
                user: ci
                password: ci
                role: DBT_ROLE
                database: CLIMATE_ANALYTICS
                warehouse: CLIMATE_WH
                schema: ci
                threads: 1
          YAML
      - run: dbt deps
      - run: dbt parse --no-partial-parse
